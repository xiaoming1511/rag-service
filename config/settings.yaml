# ============================================================
# RAG Service 配置文件
# ============================================================

# oMLX API 配置
omlx:
  base_url: "http://127.0.0.1:8000/v1"
  api_key: "dummy"                    # 已跳过认证，占位即可
  chat_model: "qwen3.5-4b-mlx-4bit"   # 或 gemma-4-e4b-it-mxfp4
  embedding_model: "bge-m3-mlx-4bit"
  reranker_model: "bge-reranker-v2-m3"
  timeout: 60.0

# 文档分块配置
chunker:
  chunk_size: 800        # 每段最大字符数
  overlap: 100           # 重叠字符数（保持上下文连贯）
  strategy: "heading"    # heading | fixed

# 检索配置
retrieval:
  top_k: 5               # 初检索返回数量
  rerank_top_k: 3        # 重排序后保留数量
  enable_rerank: true    # 是否启用重排序
  similarity_threshold: 0.5
  strict_sources: false  # 严格来源模式：检索为空时不调用模型，直接告知未找到（默认关）

# 生成配置
generation:
  max_tokens: 512
  temperature: 0.3
  stream: true           # 是否启用流式输出
  max_history_rounds: 10      # 多轮对话保留的最大轮数
  history_token_budget: 2000  # 历史 token 预算，超出从旧到新裁剪
  rewrite_query: false        # 追问改写（用模型把"那它呢"改写为独立问题），默认关闭

# 向量存储配置
vector_store:
  collection_name: "knowledge_base"
  persist_directory: "./data/chroma_db"

# 性能优化配置
performance:
  embed_cache_capacity: 4096   # 嵌入内存 LRU 缓存容量（0 关闭）
  index_max_workers: 0         # 索引并行分块线程数（0 自动，1 串行）
  response_cache: true         # 相同问题响应缓存开关（仅非流式、单轮查询）
  response_cache_ttl: 3600     # 响应缓存有效期（秒）

# 文档源配置
documents:
  source_dirs:
    - "/Users/xuhuaming/projects/obsidian"
  supported_extensions:
    - ".md"
    - ".markdown"
    - ".pdf"
    - ".docx"
    - ".html"
    - ".htm"
    - ".txt"
    - ".epub"
    - ".pptx"

# 问答沉淀配置（syntheses）
syntheses:
  enabled: true          # 每次问答写为 vault 根 syntheses/ 下的 .md（可被再次检索）
  dir: ""                # 空 = 自动（source_dirs[0]/syntheses）

# AI 知识层配置（Karpathy LLM Wiki 补齐：来源摘要/概念/实体页 + 互链 + 图谱）
wiki:
  enabled: true                       # 增量同步后自动串联知识层生成
  dir: "/Users/xuhuaming/projects/obsidian/xu/wiki"  # 写入既有 Karpathy 结构目录
  maintain_interval_min: 0            # 周期维护间隔（分钟）；0 = 关闭
  graph_path: "./data/wiki_graph.json"  # 知识图谱数据文件（GET /v1/graph）