omlx:
  base_url: http://127.0.0.1:8000/v1
  api_key: dummy
  chat_model: qwen3.5-4b-mlx-4bit
  embedding_model: bge-m3-mlx-4bit
  reranker_model: bge-reranker-v2-m3
  timeout: 60.0
chunker:
  chunk_size: 800
  overlap: 100
  strategy: heading
retrieval:
  top_k: 5
  rerank_top_k: 5
  enable_rerank: true
  similarity_threshold: 0.4
  rerank_threshold: 0.0
  strict_sources: false
  context_token_budget: 6000
  hybrid: true
  hybrid_candidates: 20
  rrf_k: 60
  parent_expansion: true
  parent_max_tokens: 1600
  recall_candidates: 24
  rerank_candidates: 8
  synthesis_weight: 0.5
generation:
  max_tokens: 1024
  temperature: 0.3
  stream: true
  max_history_rounds: 10
  history_token_budget: 2000
  rewrite_query: false
  answer_style: balanced
vector_store:
  collection_name: knowledge_base
  persist_directory: ./data/chroma_db
documents:
  source_dirs:
  - /Users/xuhuaming/projects/obsidian/xu
  supported_extensions:
  - .md
  - .markdown
  - .pdf
  - .docx
  - .html
  - .htm
  - .txt
  - .epub
  - .pptx
performance:
  embed_cache_capacity: 4096
  index_max_workers: 0
  response_cache: true
  response_cache_ttl: 3600
syntheses:
  enabled: true
  dir: ''
ocr:
  enabled: false
  model: OvisOCR2
  base_url: ''
  api_key: ''
  timeout: 120.0
  prompt: OCR
  min_text_chars: 16
  render_dpi: 150
  max_pages_per_doc: 30
  max_images_per_doc: 20
  min_image_side: 64
  max_image_pixels: 40000000
routing:
  chat: ''
  rewrite: ''
  research_subqueries: ''
auth:
  enabled: false
  api_key: ''
rate_limit:
  enabled: false
  max_per_minute: 60
